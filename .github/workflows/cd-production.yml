name: CD — Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
  K8S_NAMESPACE: unkora-prod

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - search-service
          - delivery-service
          - marketing-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/unkora-${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/unkora-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: NODE_ENV=production

  request-approval:
    name: Request Production Approval
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      # Requires manual approval in GitHub Environments settings
    steps:
      - name: Approval granted
        run: echo "Production deployment approved. Proceeding..."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: request-approval
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name unkora-prod-cluster \
            --region ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          kubectl create job db-migrate-prod-${{ github.sha }} \
            --from=cronjob/db-migrate \
            -n ${{ env.K8S_NAMESPACE }} || true
          kubectl wait --for=condition=complete \
            job/db-migrate-prod-${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      - name: Rolling deploy — non-critical services first
        run: |
          for svc in notification-service marketing-service search-service; do
            kubectl set image deployment/$svc \
              $svc=${{ env.ECR_REGISTRY }}/unkora-$svc:${{ github.sha }} \
              -n ${{ env.K8S_NAMESPACE }}
            kubectl rollout status deployment/$svc -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          done

      - name: Rolling deploy — core services
        run: |
          for svc in product-service delivery-service; do
            kubectl set image deployment/$svc \
              $svc=${{ env.ECR_REGISTRY }}/unkora-$svc:${{ github.sha }} \
              -n ${{ env.K8S_NAMESPACE }}
            kubectl rollout status deployment/$svc -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          done

      - name: Rolling deploy — critical services
        run: |
          for svc in auth-service payment-service order-service api-gateway; do
            kubectl set image deployment/$svc \
              $svc=${{ env.ECR_REGISTRY }}/unkora-$svc:${{ github.sha }} \
              -n ${{ env.K8S_NAMESPACE }}
            kubectl rollout status deployment/$svc -n ${{ env.K8S_NAMESPACE }} --timeout=300s
          done

      - name: Health checks post-deploy
        run: |
          sleep 15
          GATEWAY=$(kubectl get svc api-gateway -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          curl -f "https://api.unkora.com/health" || exit 1

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: "Production deployment ${{ github.sha }}"

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"🚀 *Unkora Production* deployed successfully! v${{ github.run_number }}"}'

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed — initiating rollback..."
          for svc in auth-service product-service order-service payment-service \
                     notification-service search-service delivery-service \
                     marketing-service api-gateway; do
            kubectl rollout undo deployment/$svc -n ${{ env.K8S_NAMESPACE }} || true
          done
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"🔴 *Unkora Production* deployment FAILED and was ROLLED BACK. Commit: ${{ github.sha }}"}'
