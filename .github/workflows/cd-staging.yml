name: CD — Staging

on:
  push:
    branches: [develop]

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
  K8S_NAMESPACE: unkora-staging

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - product-service
          - order-service
          - payment-service
          - notification-service
          - search-service
          - delivery-service
          - marketing-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/unkora-${{ matrix.service }}:staging
            ${{ env.ECR_REGISTRY }}/unkora-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name unkora-staging-cluster \
            --region ${{ env.AWS_REGION }}

      - name: Run database migrations
        run: |
          kubectl create job db-migrate-${{ github.sha }} \
            --from=cronjob/db-migrate \
            -n ${{ env.K8S_NAMESPACE }} || true
          kubectl wait --for=condition=complete \
            job/db-migrate-${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=120s

      - name: Update image tags in k8s
        run: |
          for svc in auth-service product-service order-service payment-service \
                     notification-service search-service delivery-service \
                     marketing-service api-gateway; do
            kubectl set image deployment/$svc \
              $svc=${{ env.ECR_REGISTRY }}/unkora-$svc:${{ github.sha }} \
              -n ${{ env.K8S_NAMESPACE }}
          done

      - name: Verify rollout
        run: |
          for svc in auth-service product-service order-service payment-service \
                     notification-service search-service delivery-service \
                     marketing-service api-gateway; do
            kubectl rollout status deployment/$svc \
              -n ${{ env.K8S_NAMESPACE }} \
              --timeout=300s
          done

      - name: Notify Slack on success
        if: success()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"✅ *Unkora Staging* deployed successfully. Commit: ${{ github.sha }}"}'

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            --data '{"text":"❌ *Unkora Staging* deployment FAILED. Commit: ${{ github.sha }}"}'
