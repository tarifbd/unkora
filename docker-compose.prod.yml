version: "3.9"

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - unkora-net

networks:
  unkora-net:
    driver: bridge

services:
  api-gateway:
    <<: *app-defaults
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: production
    environment:
      NODE_ENV: production
      PORT: 4000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    <<: *app-defaults
    build:
