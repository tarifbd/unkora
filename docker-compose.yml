version: "3.9"

x-common-env: &common-env
  NODE_ENV: development
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - unkora-net

networks:
  unkora-net:
    driver: bridge

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  elasticsearch_data:
  minio_data:

services:

  # ── INFRASTRUCTURE ────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: unkora-postgres
    <<: *service-defaults
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unkora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unkora_secret}
      POSTGRES_DB: ${POSTGRES_DB:-unkora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unkora"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: unkora-mongodb
    <<: *service-defaults
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-unkora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-unkora_secret}
      MONGO_INITDB_DATABASE: unkora
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unkora-redis
    <<: *service-defaults
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-unkora_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-unkora_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: unkora-elasticsearch
    <<: *service-defaults
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: unkora-minio
    <<: *service-defaults
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-unkora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-unkora_secret_2024}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ── MICROSERVICES ──────────────────────────────

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: development
    container_name: unkora-api-gateway
    ports:
      - "4000:4000"
    environment:
      <<: *common-env
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      AUTH_SERVICE_URL: http://auth-service:4001
      PRODUCT_SERVICE_URL: http://product-service:4002
      ORDER_SERVICE_URL: http://order-service:4003
      PAYMENT_SERVICE_URL: http://payment-service:4004
      NOTIFICATION_SERVICE_URL: http://notification-service:4005
      SEARCH_SERVICE_URL: http://search-service:4006
      DELIVERY_SERVICE_URL: http://delivery-service:4007
      MARKETING_SERVICE_URL: http://marketing-service:4008
    depends_on:
      - postgres
      - redis

  auth-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
      target: development
    container_name: unkora-auth-service
    ports:
      - "4001:4001"
    environment:
      <<: *common-env
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      SSL_WIRELESS_API_KEY: ${SSL_WIRELESS_API_KEY}
      SSL_WIRELESS_SID: ${SSL_WIRELESS_SID}
    depends_on:
      - postgres
      - redis

  product-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/product-service/Dockerfile
      target: development
    container_name: unkora-product-service
    ports:
      - "4002:4002"
    environment:
      <<: *common-env
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      MONGODB_URI: mongodb://${MONGO_USER:-unkora}:${MONGO_PASSWORD:-unkora_secret}@mongodb:27017/unkora?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_CLOUDFRONT_URL: ${AWS_CLOUDFRONT_URL}
    depends_on:
      - postgres
      - mongodb
      - redis
      - elasticsearch

  order-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
      target: development
    container_name: unkora-order-service
    ports:
      - "4003:4003"
    environment:
      <<: *common-env
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
    depends_on:
      - postgres
      - redis

  payment-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
      target: development
    container_name: unkora-payment-service
    ports:
      - "4004:4004"
    environment:
      <<: *common-env
      PORT: 4004
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      SSLCOMMERZ_STORE_ID: ${SSLCOMMERZ_STORE_ID}
      SSLCOMMERZ_STORE_PASS: ${SSLCOMMERZ_STORE_PASS}
      BKASH_APP_KEY: ${BKASH_APP_KEY}
      BKASH_APP_SECRET: ${BKASH_APP_SECRET}
      BKASH_USERNAME: ${BKASH_USERNAME}
      BKASH_PASSWORD: ${BKASH_PASSWORD}
      NAGAD_MERCHANT_ID: ${NAGAD_MERCHANT_ID}
      NAGAD_MERCHANT_PRIVATE_KEY: ${NAGAD_MERCHANT_PRIVATE_KEY}
    depends_on:
      - postgres
      - redis

  notification-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
      target: development
    container_name: unkora-notification-service
    ports:
      - "4005:4005"
    environment:
      <<: *common-env
      PORT: 4005
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      MONGODB_URI: mongodb://${MONGO_USER:-unkora}:${MONGO_PASSWORD:-unkora_secret}@mongodb:27017/unkora?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      SSL_WIRELESS_API_KEY: ${SSL_WIRELESS_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      - postgres
      - mongodb
      - redis

  search-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/search-service/Dockerfile
      target: development
    container_name: unkora-search-service
    ports:
      - "4006:4006"
    environment:
      <<: *common-env
      PORT: 4006
      MONGODB_URI: mongodb://${MONGO_USER:-unkora}:${MONGO_PASSWORD:-unkora_secret}@mongodb:27017/unkora?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      - mongodb
      - redis
      - elasticsearch

  delivery-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/delivery-service/Dockerfile
      target: development
    container_name: unkora-delivery-service
    ports:
      - "4007:4007"
    environment:
      <<: *common-env
      PORT: 4007
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      PATHAO_CLIENT_ID: ${PATHAO_CLIENT_ID}
      PATHAO_CLIENT_SECRET: ${PATHAO_CLIENT_SECRET}
      STEADFAST_API_KEY: ${STEADFAST_API_KEY}
      REDX_API_KEY: ${REDX_API_KEY}
    depends_on:
      - postgres
      - redis

  marketing-service:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/marketing-service/Dockerfile
      target: development
    container_name: unkora-marketing-service
    ports:
      - "4008:4008"
    environment:
      <<: *common-env
      PORT: 4008
      DATABASE_URL: postgresql://${POSTGRES_USER:-unkora}:${POSTGRES_PASSWORD:-unkora_secret}@postgres:5432/${POSTGRES_DB:-unkora}
      MONGODB_URI: mongodb://${MONGO_USER:-unkora}:${MONGO_PASSWORD:-unkora_secret}@mongodb:27017/unkora?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:-unkora_secret}@redis:6379
      FB_ACCESS_TOKEN: ${FB_ACCESS_TOKEN}
      FB_PIXEL_ID: ${FB_PIXEL_ID}
    depends_on:
      - postgres
      - mongodb
      - redis

  # ── FRONTEND APPS ──────────────────────────────

  web:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: unkora-web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: http://localhost:4000

  admin:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      target: development
    container_name: unkora-admin
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: http://localhost:4000

  vendor:
    <<: *service-defaults
    build:
      context: .
      dockerfile: apps/vendor/Dockerfile
      target: development
    container_name: unkora-vendor
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: http://localhost:4000

  # ── OBSERVABILITY ──────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: unkora-prometheus
    <<: *service-defaults
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: unkora-grafana
    <<: *service-defaults
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"

  nginx:
    image: nginx:1.27-alpine
    container_name: unkora-nginx
    <<: *service-defaults
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - admin
      - api-gateway
